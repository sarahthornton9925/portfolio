<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EFE3; --blue:#5A4FD6; --dark:#18181E; --mid:#484860;
    --soft-purple:#D4C8F5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'DM Sans',sans-serif;
    background:var(--cream); color:var(--dark);
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }

  .wrap{position:relative; z-index:1; padding:80px 64px 120px; max-width:1320px; margin:0 auto;}

  .eyebrow{
    font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.16em;
    color:var(--blue); opacity:.85; margin-bottom:10px;
  }
  .section-label{
    font-size:2.6rem; font-weight:800; color:var(--dark);
    letter-spacing:-.02em; margin-bottom:12px;
  }
  .section-desc{font-size:1.05rem; color:var(--mid); line-height:1.6; max-width:440px; margin-bottom:52px;}
  .section-desc strong{color:var(--dark); font-weight:600;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(248px, 1fr));
    gap:34px 30px;
  }

  .card{
    cursor:pointer;
    display:flex; flex-direction:column;
    opacity:0; transform:translate3d(0,26px,0);
    will-change:opacity, transform;
    transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);
  }
  .card.in{opacity:1; transform:translate3d(0,0,0);}
  .card.done{will-change:auto;}

  .thumb{
    position:relative;
    width:100%; aspect-ratio:4/3;
    border-radius:16px; overflow:hidden;
    border:1px solid rgba(90,79,214,.14);
    background:#FDFBF6;
    padding:14px;
    box-shadow:0 8px 22px rgba(60,40,110,.10);
    transition:transform .35s cubic-bezier(.34,1.4,.64,1), box-shadow .35s ease;
  }
  .thumb img{
    width:100%; height:100%; object-fit:contain; display:block;
    transition:transform .6s cubic-bezier(.22,1,.36,1);
  }
  .card:hover .thumb{
    transform:translateY(-8px);
    box-shadow:0 22px 46px rgba(60,40,110,.22);
  }
  .card:hover .thumb img{transform:scale(1.07);}

  .card-name{
    font-size:1.12rem; font-weight:700; color:var(--dark);
    margin:14px 0 4px; letter-spacing:-.01em;
    transition:color .2s;
  }
  .card:hover .card-name{color:var(--blue);}
  .card-oneliner{font-size:.92rem; color:var(--mid); line-height:1.45;}

  .divider{height:1px; background:rgba(24,24,30,.10); margin:76px 0 0;}
  .sketches{margin-top:70px;}

  @media (max-width:820px){
    .wrap{padding:56px 32px 90px;}
    .section-label{font-size:2rem;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:26px 22px;}
  }
  @media (max-width:520px){
    .wrap{padding:44px 20px 72px;}
    .grid{grid-template-columns:1fr 1fr; gap:22px 16px;}
    .card-name{font-size:1rem;}
    .card-oneliner{font-size:.84rem;}
  }

  @media (prefers-reduced-motion:reduce){
    .card{opacity:1; transform:none; transition:none; will-change:auto;}
    .thumb, .thumb img{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Selected Work</p>
  <h1 class="section-label">Projects</h1>
  <p class="section-desc">Work spanning <strong>digital experiences</strong>, <strong>physical products</strong>, and the desire to better understand people.</p>

  <div class="grid" id="grid-projects"></div>

  <div class="sketches">
    <h2 class="section-label" style="font-size:2rem;">Sketches</h2>
    <p class="section-desc">A space for ideas, experiments, and <strong>forms in progress</strong>.</p>
    <div class="grid" id="grid-sketches"></div>
  </div>
</div>

<script>
const PROJECTS = [
  {img:"Shopify cover on projects page.jpg", name:"ShopCampus", role:"UX Research", one:"AI-powered Shopify onboarding for student founders."},
  {img:"Screenshot%202026-06-02%20at%2010.03.34%20AM.jpg", name:"FetchRide", role:"Product Manager", one:"A student shuttle connecting NU with animal shelters."},
  {img:"STOW cover.jpg", name:"Stow", role:"Product Strategy", one:"Modular furniture for small college spaces."},
  {img:"Cloudflx cover photo (1).jpg", name:"CloudFlex Headrest", role:"PM · UX Research", one:"An adaptive headrest rethinking long-haul comfort."},
  {img:"Screenshot%202026-06-02%20at%2010.15.50%20AM.jpg", name:"Trova", role:"UI/UX Design", one:"A social travel app with AI-built itineraries."},
];
const SKETCHES = [
  {img:"Footwear Final pers:side.jpeg", name:"Footwear", role:"Industrial Design", one:"Trail hiking shoe concepts."},
  {img:"Kellogg steps final - perspective.jpeg", name:"Northwestern Bus Stop", role:"Industrial Design", one:"A bus stop inspired by Kellogg Steps."},
  {img:"FurnitureNookFinal1.jpeg", name:"Furniture", role:"Industrial Design", one:"Whimsical children's furniture concepts."},
];

function card(p){
  return `<div class="card">
    <div class="thumb">
      <img src="${p.img}" alt="${p.name}" decoding="async">
    </div>
    <p class="card-name">${p.name}</p>
    <p class="card-oneliner">${p.one}</p>
  </div>`;
}
document.getElementById('grid-projects').innerHTML = PROJECTS.map(card).join('');
document.getElementById('grid-sketches').innerHTML = SKETCHES.map(card).join('');

// scroll-triggered cascade reveal — lightweight, one-shot per card
const cards = document.querySelectorAll('.card');
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return;
    const el = e.target;
    const sibs = [...el.parentElement.children];
    const idx = Math.min(sibs.indexOf(el), 4);
    el.style.transitionDelay = (idx * 65) + 'ms';
    el.classList.add('in');
    el.addEventListener('transitionend', ()=>{
      el.style.transitionDelay = '';
      el.classList.add('done');
    }, {once:true});
    io.unobserve(el);
  });
},{threshold:.12});
cards.forEach(c=>io.observe(c));

// safety net: if anything hasn't revealed shortly after load, show it
window.addEventListener('load', ()=>{
  setTimeout(()=>document.querySelectorAll('.card:not(.in)').forEach(c=>{
    const r = c.getBoundingClientRect();
    if(r.top < window.innerHeight) c.classList.add('in');
  }), 300);
});
</script>
</body>
</html>
